# Example: single-step PR review.
# Copy this into the consuming repository's .github/workflows/ and adjust.
#
# This is the whole integration: one `uses:` step. Everything else is
# configuration in revu.yaml (see revu.example.yaml).
#
# Security note: a same-repository PR can edit revu.yaml, including
# provider.baseUrl. Pin the endpoint and allowlist it from the workflow (below)
# so the key cannot be redirected, or use the two-phase fork-safe flow in
# examples/fork-safe/ — which is the recommended integration for any untrusted
# PR, fork or not.

name: Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write       # archive findings to the bot branch
  pull-requests: write  # post the summary comment
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: greadee/review-engine@30e90d550f0fab6e0c3e05a95e4a98b08838af31
        with:
          profile: pr
          model: gpt-4o-mini
          base-url: https://api.openai.com/v1
          allowed-base-urls: https://api.openai.com/v1
          base: origin/${{ github.base_ref }}
          head: ${{ github.sha }}
          pr: ${{ github.event.pull_request.number }}
          api-key: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
