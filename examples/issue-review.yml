# Example: issue review with closure gating.
# Runs when an issue is closed, reviews it against its acceptance criteria, and
# comments. A criterion counts as satisfied only when it cites independent
# evidence (a linked test/path, PR/commit reference, or explicit approval); a
# checked box alone is reported as unverified and never closes the issue.
#
# Defaults: comment-only. Set `close: "true"` to close an issue automatically
# once every criterion is independently verified, `reopen: "true"` to reopen a
# closed issue with unverified criteria, and `block: "true"` to fail the step
# on unverified criteria (useful as a required check when a PR declares
# `Closes #n`).

name: Issue review

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  issue-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: greadee/review-engine@v1
        with:
          profile: issue
          issue: ${{ github.event.issue.number }}
          comment: "true"
          close: "false"    # set true to close when all criteria are met
          reopen: "false"   # set true to auto-reopen when criteria are unmet
          block: "false"
          api-key: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
