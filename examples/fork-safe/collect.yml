# Fork-safe review — phase 1 of 2 (collect, no secrets).
#
# Copy this to the consuming repository's .github/workflows/ alongside
# finalize.yml. This workflow runs on untrusted PRs and never sees secrets.

name: Review collect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: greadee/review-engine@30e90d550f0fab6e0c3e05a95e4a98b08838af31
        with:
          phase: collect
          profile: pr
          base: origin/${{ github.base_ref }}
          head: ${{ github.sha }}
          repository: ${{ github.repository }}
          bundle: bundle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revu-bundle
          path: bundle.json
          retention-days: 7
