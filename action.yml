name: Review Engine
description: General-purpose code review / PR review / issue review / repository audit.
author: greadee

branding:
  icon: shield
  color: purple

inputs:
  phase:
    description: "all | collect (no secrets) | finalize (secrets)"
    required: false
    default: all
  bundle:
    description: "Bundle path for collect/finalize"
    required: false
    default: bundle.json
  profile:
    description: "Review profile: pr | issue | sprint | audit | impact"
    required: false
    default: pr
  provider:
    description: "Model provider (openai-compatible | fake)"
    required: false
    default: openai-compatible
  model:
    description: "Model id to use for semantic review"
    required: false
    default: ""
  base-url:
    description: "Trusted provider endpoint (overrides revu.yaml; workflow-controlled)"
    required: false
    default: ""
  allowed-base-urls:
    description: "Comma-separated trusted provider endpoints allowed to receive the key"
    required: false
    default: ""
  semantic:
    description: "Run the model-backed semantic pass (true|false)"
    required: false
    default: "true"
  base:
    description: "Base revision"
    required: false
    default: origin/main
  head:
    description: "Head revision"
    required: false
    default: HEAD
  config:
    description: "Path to revu.yaml for run/finalize; collect policy comes from the base revision"
    required: false
    default: revu.yaml
  repository:
    description: "owner/name used when publishing or commenting"
    required: false
    default: ${{ github.repository }}
  pr:
    description: "Pull request number (when the event is a PR)"
    required: false
    default: ""
  issue:
    description: "Issue number (for the issue profile)"
    required: false
    default: ""
  expect-repository:
    description: "finalize: require the bundle to describe this repository"
    required: false
    default: ""
  expect-pr:
    description: "finalize: require the bundle to describe this pull request"
    required: false
    default: ""
  expect-head:
    description: "finalize: require the bundle to describe this head revision"
    required: false
    default: ""
  expect-profile:
    description: "finalize: require the bundle to use this profile"
    required: false
    default: ""
  publish:
    description: "Archive findings to the bot branch"
    required: false
    default: "true"
  comment:
    description: "Post the summary as a PR or issue comment"
    required: false
    default: "true"
  block:
    description: "Fail the step when blocking findings (or unmet criteria) exist"
    required: false
    default: "true"
  reopen:
    description: "Reopen a closed issue with unmet criteria (issue profile)"
    required: false
    default: "false"
  close:
    description: "Close an open issue when every acceptance criterion is met (issue profile)"
    required: false
    default: "false"
  archive-branch:
    description: "Bot branch for archived findings"
    required: false
    default: review-artifacts
  store-sqlite:
    description: "Use the SQLite tracking store instead of JSON (default off)"
    required: false
    default: "false"
  block-threshold:
    description: "Severity at or above which the run fails (P0|P1|P2|P3)"
    required: false
    default: P1
  coverage-threshold:
    description: "Minimum fraction (0..1) of selected files that must be analyzed (default 1.0)"
    required: false
    default: ""
  api-key:
    description: "Provider API key (pass a secret)"
    required: false
    default: ""

outputs:
  summary:
    description: "Path to the rendered Markdown summary"
    value: ${{ steps.run.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26"

    - name: Build revu
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REVIEW_ACTION_REF: ${{ github.action_ref }}
      run: go build -ldflags "-X main.version=${REVIEW_ACTION_REF:-dev}" -o "$RUNNER_TEMP/revu" ./cmd/revu

    - name: Run review
      id: run
      shell: bash
      # Every input is exposed as data through the environment; the script never
      # interpolates a caller-supplied value into its text. See scripts/run-action.sh.
      env:
        REVIEW_INPUT_PHASE: ${{ inputs.phase }}
        REVIEW_INPUT_BUNDLE: ${{ inputs.bundle }}
        REVIEW_INPUT_PROFILE: ${{ inputs.profile }}
        REVIEW_INPUT_PROVIDER: ${{ inputs.provider }}
        REVIEW_INPUT_MODEL: ${{ inputs.model }}
        REVIEW_INPUT_BASE_URL: ${{ inputs.base-url }}
        REVIEW_INPUT_ALLOWED_BASE_URLS: ${{ inputs.allowed-base-urls }}
        REVIEW_INPUT_SEMANTIC: ${{ inputs.semantic }}
        REVIEW_INPUT_BASE: ${{ inputs.base }}
        REVIEW_INPUT_HEAD: ${{ inputs.head }}
        REVIEW_INPUT_CONFIG: ${{ inputs.config }}
        REVIEW_INPUT_REPOSITORY: ${{ inputs.repository }}
        REVIEW_INPUT_PR: ${{ inputs.pr }}
        REVIEW_INPUT_ISSUE: ${{ inputs.issue }}
        REVIEW_INPUT_EXPECT_REPOSITORY: ${{ inputs.expect-repository }}
        REVIEW_INPUT_EXPECT_PR: ${{ inputs.expect-pr }}
        REVIEW_INPUT_EXPECT_HEAD: ${{ inputs.expect-head }}
        REVIEW_INPUT_EXPECT_PROFILE: ${{ inputs.expect-profile }}
        REVIEW_INPUT_PUBLISH: ${{ inputs.publish }}
        REVIEW_INPUT_COMMENT: ${{ inputs.comment }}
        REVIEW_INPUT_BLOCK: ${{ inputs.block }}
        REVIEW_INPUT_REOPEN: ${{ inputs.reopen }}
        REVIEW_INPUT_CLOSE: ${{ inputs.close }}
        REVIEW_INPUT_ARCHIVE_BRANCH: ${{ inputs.archive-branch }}
        REVIEW_INPUT_STORE_SQLITE: ${{ inputs.store-sqlite }}
        REVIEW_INPUT_BLOCK_THRESHOLD: ${{ inputs.block-threshold }}
        REVIEW_INPUT_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        REVIEW_ACTION_PATH: ${{ github.action_path }}
        REVIEW_PROVIDER_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        bash "$REVIEW_ACTION_PATH/scripts/run-action.sh"
