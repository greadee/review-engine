# Example revu.yaml — copy to the root of the repository you want reviewed.
# Every field is optional; defaults are shown.

profile: pr          # pr | issue | sprint | audit | impact
mode: tracking       # tracking | stateless

provider:
  name: openai-compatible   # or: fake
  baseUrl: https://api.openai.com/v1
  model: gpt-4o-mini
  apiKeyEnv: REVIEW_PROVIDER_API_KEY

review:
  static: true       # run language static analyzers
  semantic: true     # run the model-backed semantic pass
  maxFiles: 60
  maxFileBytes: 200000
  blockThreshold: P1 # run fails when a finding is at or above this severity
  coverageThreshold: 1.0 # min fraction of selected files that must be analyzed; below this the result is "Incomplete"

archive:
  enabled: true
  branch: review-artifacts
  dir: runs

# Offline, project-scoped storage. When enabled (or with --local), a run writes
# to <dir>/<project>/<archive.dir>/<runID>.{json,md} and never touches GitHub.
local:
  enabled: false
  dir: .review-engine

# When findings are written to any store (local, archive, tracking). Notification
# (the PR/issue comment) is independent and controlled by --comment.
persist:
  mode: always        # always | on-findings | on-risk | never
  risk: P2            # severity threshold (P0..P3) used by on-risk

store:
  sqlite: false       # opt-in; JSON is the default backend
  path: ""            # default: <state-dir>/review.db

# Per-profile overrides so one config serves every review type. Combine with a
# global config (REVIEW_GLOBAL_CONFIG or <user-config-dir>/revu/config.yaml) to
# share defaults across many repositories.
profiles:
  audit:
    blockThreshold: P2
    ignore:
      - "vendor/**"
      - "**/*.md"
  pr:
    blockThreshold: P1

issueReview:
  commentOnly: true  # default
  autoClose: false   # close an issue when every criterion is independently verified
  autoReopen: false  # reopen a closed issue that still has unverified criteria
  blockMerge: false  # fail the check when criteria lack verified evidence
  verifiedLabel: ""  # e.g. "revu-verified": a label that counts as explicit reviewer approval

ignore:
  - "vendor/**"
  - "**/*.md"
