# Reusable review workflow.
#
# Callers (same repository or trusted PRs):
#
#   jobs:
#     review:
#       uses: greadee/review-engine/.github/workflows/review.yml@7de258fcb3c50467bdc87f89443af800527f706a
#       with:
#         profile: pr
#         base: origin/main
#         head: ${{ github.sha }}
#         pr: ${{ github.event.pull_request.number }}
#       secrets:
#         provider-api-key: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
#
# The collect job runs without secrets (safe against untrusted code); the
# finalize job never checks out the repository and only consumes the bundle.
# For untrusted forks, secrets are unavailable to `pull_request`, so bridge the
# two phases with `workflow_run` — see examples/fork-safe/.

name: Review (reusable)

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: pr
      base:
        type: string
        default: origin/main
      head:
        type: string
        default: HEAD
      pr:
        type: string
        default: ""
      model:
        type: string
        default: ""
      semantic:
        type: string
        default: "true"
      repository:
        type: string
        default: ""
      publish:
        type: string
        default: "true"
      comment:
        type: string
        default: "true"
      block:
        type: string
        default: "true"
    secrets:
      provider-api-key:
        required: false

jobs:
  collect:
    name: collect (no secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: greadee/review-engine@7de258fcb3c50467bdc87f89443af800527f706a
        with:
          phase: collect
          profile: ${{ inputs.profile }}
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          pr: ${{ inputs.pr }}
          repository: ${{ inputs.repository }}
          bundle: bundle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revu-bundle
          path: bundle.json
          retention-days: 7

  finalize:
    name: finalize (secrets)
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: revu-bundle
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .review-state
          key: revu-state-${{ github.repository }}-pr-${{ inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            revu-state-${{ github.repository }}-pr-${{ inputs.pr }}-
      - uses: greadee/review-engine@7de258fcb3c50467bdc87f89443af800527f706a
        with:
          phase: finalize
          model: ${{ inputs.model }}
          semantic: ${{ inputs.semantic }}
          repository: ${{ inputs.repository }}
          pr: ${{ inputs.pr }}
          publish: ${{ inputs.publish }}
          comment: ${{ inputs.comment }}
          block: ${{ inputs.block }}
          expect-repository: ${{ inputs.repository }}
          expect-pr: ${{ inputs.pr }}
          expect-head: ${{ github.sha }}
          expect-profile: ${{ inputs.profile }}
          bundle: bundle.json
          api-key: ${{ secrets.provider-api-key }}
