# Reusable review workflow.
#
# Callers (same repository or trusted PRs):
#
#   jobs:
#     review:
#       uses: greadee/review-engine/.github/workflows/review.yml@7de258fcb3c50467bdc87f89443af800527f706a
#       with:
#         profile: pr
#         base: origin/main
#         head: ${{ github.sha }}
#         pr: ${{ github.event.pull_request.number }}
#       secrets:
#         provider-api-key: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
#
# The collect job runs without secrets (safe against untrusted code); the
# finalize job never checks out the repository and only consumes the bundle.
# For untrusted forks, secrets are unavailable to `pull_request`, so bridge the
# two phases with `workflow_run` — see examples/fork-safe/.

name: Review (reusable)

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: pr
      base:
        type: string
        default: origin/main
      head:
        type: string
        default: HEAD
      pr:
        type: string
        default: ""
      model:
        type: string
        default: ""
      semantic:
        type: string
        default: "true"
      repository:
        type: string
        default: ""
      publish:
        type: string
        default: "true"
      comment:
        type: string
        default: "true"
      block:
        type: string
        default: "true"
      max-batch-files:
        type: string
        default: ""
      max-batch-bytes:
        type: string
        default: ""
    secrets:
      provider-api-key:
        required: false

jobs:
  collect:
    name: collect (no secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: greadee/review-engine@7de258fcb3c50467bdc87f89443af800527f706a
        with:
          phase: collect
          profile: ${{ inputs.profile }}
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          pr: ${{ inputs.pr }}
          repository: ${{ inputs.repository }}
          bundle: bundle.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revu-bundle
          path: bundle.json
          retention-days: 7

  finalize:
    name: finalize (secrets)
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: revu-finalize-${{ github.repository }}-${{ inputs.pr }}-${{ inputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: revu-bundle
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .review-state
          key: revu-state-${{ github.repository }}-pr-${{ inputs.pr }}-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            revu-state-${{ github.repository }}-pr-${{ inputs.pr }}-${{ inputs.profile }}-
      - uses: greadee/review-engine@7de258fcb3c50467bdc87f89443af800527f706a
        with:
          phase: finalize
          model: ${{ inputs.model }}
          semantic: ${{ inputs.semantic }}
          repository: ${{ inputs.repository }}
          pr: ${{ inputs.pr }}
          publish: ${{ inputs.publish }}
          comment: ${{ inputs.comment }}
          block: ${{ inputs.block }}
          max-batch-files: ${{ inputs.max-batch-files }}
          max-batch-bytes: ${{ inputs.max-batch-bytes }}
          expect-repository: ${{ inputs.repository }}
          expect-pr: ${{ inputs.pr }}
          expect-head: ${{ github.sha }}
          expect-profile: ${{ inputs.profile }}
          bundle: bundle.json
          api-key: ${{ secrets.provider-api-key }}
