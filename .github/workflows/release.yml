name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.2.0"
        required: true
      title:
        description: "Release title, for example v1.2.0 Common Chimpanzee"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          RELEASE_GIT_NAME: github-actions[bot]
          RELEASE_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION#v}.md"
          bash scripts/release.sh --version "$VERSION" --title "$TITLE" --notes "$notes"
