name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Corpus evaluation
        run: |
          go build -o revu ./cmd/revu
          ./revu eval --corpus testdata/corpus --check

      - name: Verify published action tags
        run: git ls-remote --tags origin refs/tags/v1 | grep -q "refs/tags/v1$"
