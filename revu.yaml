profile: pr
mode: tracking

review:
  static: true
  semantic: true
  maxFiles: 60
  maxFileBytes: 200000
  blockThreshold: P1
  coverageThreshold: 1.0

archive:
  enabled: true
  branch: review-artifacts
  dir: runs

local:
  enabled: false
  dir: .review-engine

persist:
  mode: always
  risk: P2

store:
  sqlite: false
  path: ""

ignore:
  - "vendor/**"
  - "**/*.md"
